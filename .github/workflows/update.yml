name: Update manifest

# Checks for a new TrackDeck release and updates bucket/trackdeck.json.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "TrackDeck version (empty: the latest release)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-manifest.sh ${{ inputs.version }}
      - name: Commit if it changed
        id: commit
        run: |
          if git diff --quiet; then echo "up to date"; exit 0; fi
          v=$(jq -r .version bucket/trackdeck.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "trackdeck $v"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
